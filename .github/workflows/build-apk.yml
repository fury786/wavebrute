name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The runner ships several JDKs but defaults JAVA_HOME to Java 11.
      # The Android Gradle plugin used by the buildozer/python-for-android
      # toolchain requires Java 17, so set it as the active JDK explicitly.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer Cython==0.29.33 virtualenv

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wavebrute-debug-apk
          path: bin/*.apk
